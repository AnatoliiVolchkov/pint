check: alerts/external_labels
cases:
  - name: external label not configured
    kind: positive
    rules: |
      - alert: Down
        expr: 'el_up{job="a" or job="b"} == 0'
        annotations:
          summary: 'down in {{ $externalLabels.cluster }}'
    data:
      step: 15s
      series:
        - metric: el_up{job="a"}
          values: 1x20
    expect:
      - rule: Down
        reporter: alerts/external_labels
        severity: bug
        summary: invalid label
        lines: "4"
        diagnostics:
          - message: The template is using `cluster` external label but it isn't set for `vm` VictoriaMetrics server at $URI, so vmalert renders it as an empty string. If vmalert sets it with `-external.label`, add it to `externalLabels` of this server or pass it with `--external-label`.
            fragment: down in {{ $externalLabels.cluster }}
            start: 0
            end: 37
            line: 4
  - name: external label configured
    kind: negative
    settings:
      externalLabels: cluster=demo
    rules: |
      - alert: Down
        expr: 'el_ok_up{job="a" or job="b"} == 0'
        annotations:
          summary: 'down in {{ $externalLabels.cluster }}'
    data:
      step: 15s
      series:
        - metric: el_ok_up{job="a"}
          values: 1x20
    expect: []
  - name: other external label configured
    kind: positive
    settings:
      externalLabels: region=eu
    rules: |
      - alert: Down
        expr: 'el_other_up == 0'
        labels:
          cluster: '{{ $externalLabels.cluster }}'
    data:
      step: 15s
      series:
        - metric: el_other_up{job="a"}
          values: 1x20
    expect:
      - rule: Down
        reporter: alerts/external_labels
        severity: bug
        summary: invalid label
        lines: "4"
        diagnostics:
          - message: The template is using `cluster` external label but it isn't set for `vm` VictoriaMetrics server at $URI, so vmalert renders it as an empty string. If vmalert sets it with `-external.label`, add it to `externalLabels` of this server or pass it with `--external-label`.
            fragment: '{{ $externalLabels.cluster }}'
            start: 0
            end: 29
            line: 4
