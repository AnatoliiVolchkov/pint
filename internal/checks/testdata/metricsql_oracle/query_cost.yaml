check: query/cost
cases:
  - name: more series than allowed
    kind: positive
    settings:
      maxSeries: "2"
    rules: |
      - record: x
        expr: 'cost_many'
    data:
      step: 15s
      series:
        - metric: cost_many{i="1"}
          values: 1x20
        - metric: cost_many{i="2"}
          values: 1x20
        - metric: cost_many{i="3"}
          values: 1x20
    vm:
      - query: count(cost_many)
        result: '{} 3'
    expect:
      - rule: x
        reporter: query/cost
        severity: bug
        summary: query is too expensive
        lines: "2"
        diagnostics:
          - message: '`vm` Prometheus server at $URI returned 3 result(s), maximum allowed series is 2.'
            fragment: cost_many
            start: 0
            end: 9
            line: 2
  - name: within series limit
    kind: negative
    settings:
      maxSeries: "10"
    rules: |
      - record: x
        expr: 'sum(cost_few) by (i)'
    data:
      step: 15s
      series:
        - metric: cost_few{i="1"}
          values: 1x20
        - metric: cost_few{i="2"}
          values: 1x20
    expect: []
  - name: total samples limit from the query trace
    kind: positive
    comment: >-
      VictoriaMetrics query stats don't include samples, pint traces the cost query and sums
      samplesScanned from the trace.
    settings:
      maxTotalSamples: "10"
    rules: |
      - record: x
        expr: 'cost_trace'
    data:
      step: 15s
      series:
        - metric: cost_trace{i="1"}
          values: 1x20
    expect:
      - rule: x
        reporter: query/cost
        severity: bug
        summary: query is too expensive
        lines: "2"
        diagnostics:
          # v1.153.0 single-node and cluster scanned 21 samples.
          - message_re: '^`vm` Prometheus server at \$URI queried [0-9]+ samples in total when executing this query, which is more than the configured limit of 10\.$'
            fragment: cost_trace
            start: 0
            end: 10
            line: 2
  - name: peak samples limit unsupported by VictoriaMetrics
    kind: positive
    comment: VictoriaMetrics doesn't report the peak number of samples, the limit can't be enforced.
    settings:
      maxPeakSamples: "100"
    rules: |
      - record: x
        expr: 'cost_peak'
    data:
      step: 15s
      series:
        - metric: cost_peak{i="1"}
          values: 1x20
    expect:
      - rule: x
        reporter: query/cost
        severity: warning
        summary: unsupported query cost limit
        lines: "2"
        diagnostics:
          - message: '`vm` Prometheus server at $URI is a VictoriaMetrics server which doesn''t report the peak number of samples, `maxPeakSamples` limit can''t be enforced.'
            fragment: cost_peak
            start: 0
            end: 9
            line: 2
