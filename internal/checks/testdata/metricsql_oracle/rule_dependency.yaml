check: rule/dependency
cases:
  - name: removed recording rule used by an or filter
    kind: positive
    state: removed
    rules: |
      - record: foo
        expr: sum(rate(bar[5m]))
    others:
      - path: alerts.yaml
        rules: |
          - alert: Missing
            expr: 'WITH (x = {__name__="foo" or __name__="baz"}) x == 0'
    expect:
      - rule: foo
        reporter: rule/dependency
        severity: warning
        summary: rule results used by another rule
        lines: "1"
        diagnostics:
          - message: The metric generated by this rule is used by 1 other rule(s).
            fragment: foo
            start: 0
            end: 3
            line: 1
  - name: removed recording rule used by name
    kind: positive
    state: removed
    rules: |
      - record: foo
        expr: sum(rate(bar[5m]))
    others:
      - path: alerts.yaml
        rules: |
          - alert: Missing
            expr: 'rollup_rate(foo) > 0'
    expect:
      - rule: foo
        reporter: rule/dependency
        severity: warning
        summary: rule results used by another rule
        lines: "1"
        diagnostics:
          - message: The metric generated by this rule is used by 1 other rule(s).
            fragment: foo
            start: 0
            end: 3
            line: 1
  - name: removed rule nobody uses
    kind: negative
    state: removed
    rules: |
      - record: foo
        expr: sum(rate(bar[5m]))
    others:
      - path: alerts.yaml
        rules: |
          - alert: Other
            expr: 'foobar{a="1" or b="2"} > 0'
    expect: []
  - name: similar metric name prefix
    kind: boundary
    comment: foo_total is a different metric than foo.
    state: removed
    rules: |
      - record: foo
        expr: sum(rate(bar[5m]))
    others:
      - path: alerts.yaml
        rules: |
          - alert: Other
            expr: 'foo_total > 0'
    expect: []
  - name: rule still defined elsewhere
    kind: negative
    state: removed
    rules: |
      - record: foo
        expr: sum(rate(bar[5m]))
    others:
      - path: other.yaml
        rules: |
          - record: foo
            expr: sum(rate(bar[5m]))
      - path: alerts.yaml
        rules: |
          - alert: Missing
            expr: 'rollup_rate(foo) > 0'
    expect: []
  - name: recording rule from another group
    kind: positive
    comment: >-
      vmalert rules only see results written before they run, without eval_offset the reader
      sees the previous cycle of the other group.
    rules: |
      groups:
        - name: base
          interval: 1m
          rules:
            - record: error:rate5m
              expr: sum(rate(errors_total[5m])) by (job)
        - name: aggregations
          interval: 1m
          rules:
            - record: error:rate5m:avg
              expr: 'avg(error:rate5m{job="a" or job="b"})'
    expect:
      - rule: error:rate5m:avg
        reporter: rule/dependency
        severity: warning
        summary: rule uses metric produced by a recording rule from a different group
        lines: "11"
        diagnostics:
          - message: The rule uses `error:rate5m` which is generated by a recording rule in a different group `base`.
            fragment: error:rate5m{job="a" or job="b"}
            start: 4
            end: 36
            line: 11
  - name: groups chained with eval_offset
    kind: negative
    comment: >-
      The reader group runs 30s after the writer group in the same cycle, vmalert v1.153.0
      showed it sees the result written 30 seconds earlier.
    rules: |
      groups:
        - name: base
          interval: 1m
          eval_offset: 10s
          rules:
            - record: error:rate5m
              expr: sum(rate(errors_total[5m])) by (job)
        - name: aggregations
          interval: 1m
          eval_offset: 40s
          rules:
            - record: error:rate5m:avg
              expr: 'avg(error:rate5m{job="a" or job="b"})'
    expect: []
