check: rule/dependency
cases:
  - name: removed recording rule used by an or filter
    kind: positive
    state: removed
    rules: |
      - record: foo
        expr: sum(rate(bar[5m]))
    others:
      - path: alerts.yaml
        rules: |
          - alert: Missing
            expr: 'WITH (x = {__name__="foo" or __name__="baz"}) x == 0'
    expect:
      - rule: foo
        reporter: rule/dependency
        severity: warning
        summary: rule results used by another rule
        lines: "1"
        diagnostics:
          - message: The metric generated by this rule is used by 1 other rule(s).
            fragment: foo
            start: 0
            end: 3
            line: 1
  - name: removed recording rule used by name
    kind: positive
    state: removed
    rules: |
      - record: foo
        expr: sum(rate(bar[5m]))
    others:
      - path: alerts.yaml
        rules: |
          - alert: Missing
            expr: 'rollup_rate(foo) > 0'
    expect:
      - rule: foo
        reporter: rule/dependency
        severity: warning
        summary: rule results used by another rule
        lines: "1"
        diagnostics:
          - message: The metric generated by this rule is used by 1 other rule(s).
            fragment: foo
            start: 0
            end: 3
            line: 1
  - name: removed rule nobody uses
    kind: negative
    state: removed
    rules: |
      - record: foo
        expr: sum(rate(bar[5m]))
    others:
      - path: alerts.yaml
        rules: |
          - alert: Other
            expr: 'foobar{a="1" or b="2"} > 0'
    expect: []
  - name: similar metric name prefix
    kind: boundary
    comment: foo_total is a different metric than foo.
    state: removed
    rules: |
      - record: foo
        expr: sum(rate(bar[5m]))
    others:
      - path: alerts.yaml
        rules: |
          - alert: Other
            expr: 'foo_total > 0'
    expect: []
  - name: rule still defined elsewhere
    kind: negative
    state: removed
    rules: |
      - record: foo
        expr: sum(rate(bar[5m]))
    others:
      - path: other.yaml
        rules: |
          - record: foo
            expr: sum(rate(bar[5m]))
      - path: alerts.yaml
        rules: |
          - alert: Missing
            expr: 'rollup_rate(foo) > 0'
    expect: []
