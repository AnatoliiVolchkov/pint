check: rule/report
cases:
  - name: report every MetricsQL rule
    kind: positive
    settings:
      comment: MetricsQL rule found
    rules: |
      - record: x
        expr: 'quantiles("phi", 0.5, 0.9, rate(foo))'
    expect:
      - rule: x
        reporter: rule/report
        severity: bug
        summary: problem reported by config rule
        lines: 1-2
        diagnostics:
          - message: MetricsQL rule found
            fragment: x
            start: 0
            end: 1
            line: 1
