check: labels/conflict
cases:
  - name: rule label conflicts with external label
    kind: positive
    settings:
      externalLabels: cluster=demo
    rules: |
      - record: x
        expr: 'sum(lc_up{job="a" or job="b"}) by (job)'
        labels:
          cluster: dev
    data:
      step: 15s
      series:
        - metric: lc_up{job="a"}
          values: 1x20
    expect:
      - rule: x
        reporter: labels/conflict
        severity: warning
        summary: conflicting labels
        lines: "4"
        diagnostics:
          - message: '`cluster="demo"` is an external label of `vm` VictoriaMetrics server at $URI and vmalert adds it to all alerts and recording rule results, this rule overrides it with "dev". Please choose a different name for this label to avoid any conflicts.'
            fragment: cluster
            start: 0
            end: 7
            line: 4
  - name: no conflicting labels
    kind: negative
    settings:
      externalLabels: cluster=demo
    rules: |
      - record: x
        expr: 'sum(lc_ok_up) by (job)'
        labels:
          team: infra
    data:
      step: 15s
      series:
        - metric: lc_ok_up{job="a"}
          values: 1x20
    expect: []
  - name: label with the same value as the external label
    kind: boundary
    settings:
      externalLabels: cluster=demo
    rules: |
      - record: x
        expr: 'sum(lc_same_up) by (job)'
        labels:
          cluster: demo
    data:
      step: 15s
      series:
        - metric: lc_same_up{job="a"}
          values: 1x20
    expect:
      - rule: x
        reporter: labels/conflict
        severity: warning
        summary: conflicting labels
        lines: "4"
        diagnostics:
          - message: This label is redundant. `cluster="demo"` is an external label of `vm` VictoriaMetrics server at $URI and vmalert adds it to all alerts and recording rule results, there's no need to set it manually.
            fragment: cluster
            start: 0
            end: 7
            line: 4
  - name: alert on more than one metric
    kind: positive
    comment: >-
      vmalert drops the metric name from alerts, so series of lc_x and lc_y with the same other
      labels collide and vmalert fails the rule (checked with vmalert v1.153.0).
    rules: |
      - alert: Collide
        expr: '{__name__=~"lc_x|lc_y"} > 0'
    expect:
      - rule: Collide
        reporter: labels/conflict
        severity: warning
        summary: rule results can have the same labels
        lines: "2"
        diagnostics:
          - message: '`{__name__=~"lc_x|lc_y"}` can return series of more than one metric, series that only differ by the metric name get the same labels once the name is dropped and the whole rule fails.'
            fragment: '{__name__=~"lc_x|lc_y"}'
            start: 0
            end: 23
            line: 2
  - name: metric name kept in another label
    kind: negative
    comment: The fix from the vmalert docs, checked with vmalert v1.153.0.
    rules: |
      - alert: Kept
        expr: 'label_replace({__name__=~"lc_x|lc_y"} > 0, "metric", "$1", "__name__", "(.+)")'
    expect: []
  - name: aggregation by the metric name over more than one metric
    kind: positive
    comment: >-
      sum by (__name__) keeps the metric name, vmalert drops it from alerts and fails the rule
      (checked with vmalert v1.153.0).
    rules: |
      - alert: CollideSum
        expr: 'sum({__name__=~"lc_x|lc_y"}) by (__name__) > 0'
    expect:
      - rule: CollideSum
        reporter: labels/conflict
        severity: warning
        summary: rule results can have the same labels
        lines: "2"
        diagnostics:
          - message: '`{__name__=~"lc_x|lc_y"}` can return series of more than one metric, series that only differ by the metric name get the same labels once the name is dropped and the whole rule fails.'
            fragment: '{__name__=~"lc_x|lc_y"}'
            start: 4
            end: 27
            line: 2
  - name: outer aggregation drops the metric name
    kind: negative
    comment: Checked with vmalert v1.153.0.
    rules: |
      - alert: OuterSum
        expr: 'sum(sum({__name__=~"lc_x|lc_y"}) by (__name__)) > 0'
    expect: []
  - name: regexp of one literal metric name
    kind: negative
    comment: >-
      A regexp made of one literal name matches one metric, vmalert v1.153.0 evaluated
      sum({__name__=~"x"}) by (__name__) > 0 without errors.
    rules: |
      - alert: OneMetric
        expr: 'sum({__name__=~"lc_x"}) by (__name__) > 0'
    expect: []
