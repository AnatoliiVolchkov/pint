check: rule/vmalert
cases:
  - name: debug left on for a group
    kind: positive
    rules: |
      groups:
      - name: g
        debug: true
        rules:
        - alert: Down
          expr: 'up{job="a" or job="b"} == 0'
    expect:
      - rule: Down
        reporter: rule/vmalert
        severity: warning
        summary: debug mode enabled
        lines: "3"
        diagnostics:
          - message: '`debug: true` makes vmalert log every query of every rule in this group and every change of their alerts'' state.'
            fragment: "true"
            start: 0
            end: 4
            line: 3
  - name: debug left on for a recording rule
    kind: positive
    rules: |
      - record: job:up:sum
        expr: 'sum(up{job="a" or job="b"}) by (job)'
        debug: true
    expect:
      - rule: job:up:sum
        reporter: rule/vmalert
        severity: warning
        summary: debug mode enabled
        lines: "3"
        diagnostics:
          - message: '`debug: true` makes vmalert log every query of this rule.'
            fragment: "true"
            start: 0
            end: 4
            line: 3
  - name: debug turned off
    kind: negative
    rules: |
      - alert: Down
        expr: 'up{job="a" or job="b"} == 0'
        debug: false
    expect: []
  - name: latency_offset longer than the default eval_delay
    kind: positive
    rules: |
      groups:
      - name: g
        params:
          latency_offset: ["3m"]
        rules:
        - alert: Down
          expr: 'up{job="a" or job="b"} == 0'
    expect:
      - rule: Down
        reporter: rule/vmalert
        severity: warning
        summary: latency_offset longer than eval_delay
        lines: "4"
        diagnostics:
          - message: 'VictoriaMetrics answers queries of this group with data at least 3m old, but vmalert evaluates them 30s before now, `-rule.evalDelay`, 30s by default, as the group doesn''t set `eval_delay`, and stamps the results with that time, so alerts and recording rule results lag 2m30s behind. Set `eval_delay: 3m`.'
            fragment: 3m
            start: 0
            end: 2
            line: 4
  - name: latency_offset equal to eval_delay
    kind: negative
    rules: |
      groups:
      - name: g
        eval_delay: 3m
        params:
          latency_offset: ["3m"]
        rules:
        - alert: Down
          expr: 'up{job="a" or job="b"} == 0'
    expect: []
  - name: rule returning more results than the group limit
    kind: positive
    comment: >-
      vmalert v1.153.0 fails such a rule with "exec exceeded limit of 2 with 3 series" and drops
      its results (Docker, 2026-11-06).
    rules: |
      groups:
      - name: g
        limit: 2
        rules:
        - record: rv:sum
          expr: 'sum(rv_limit) by (inst)'
    data:
      step: 15s
      series:
        - metric: rv_limit{inst="a"}
          values: 1x30
        - metric: rv_limit{inst="b"}
          values: 1x30
        - metric: rv_limit{inst="c"}
          values: 1x30
    expect:
      - rule: rv:sum
        reporter: rule/vmalert
        severity: warning
        summary: rule returns more results than vmalert allows
        lines: "6"
        diagnostics:
          - message: '`vm` VictoriaMetrics server at $URI returned 3 result(s) for this query, more than `limit: 2` of the group: vmalert would fail this rule with `exec exceeded limit of 2 with 3 series` and drop all its results.'
            fragment: 'sum(rv_limit) by (inst)'
            start: 0
            end: 23
            line: 6
  - name: rule returning as many results as the group limit
    kind: boundary
    rules: |
      groups:
      - name: g
        limit: 3
        rules:
        - record: rv:ok
          expr: 'sum(rv_limit_ok) by (inst)'
    data:
      step: 15s
      series:
        - metric: rv_limit_ok{inst="a"}
          values: 1x30
        - metric: rv_limit_ok{inst="b"}
          values: 1x30
        - metric: rv_limit_ok{inst="c"}
          values: 1x30
    vm:
      - query: count(sum(rv_limit_ok) by (inst))
        result: '{} 3'
    expect: []
