check: alerts/absent
cases:
  - name: absent without for
    kind: positive
    settings:
      scrapeInterval: 1m
    rules: |
      - alert: Missing
        expr: 'absent(absent_up{job="a"})'
    data:
      step: 1m
      series:
        - metric: absent_up{job="a"}
          values: 1x30
    vm:
      - query: absent(absent_up{job="a"})
        result: empty
    expect:
      - rule: Missing
        reporter: alerts/absent
        severity: warning
        summary: absent() based alert without for
        lines: "2"
        diagnostics:
          - message: Using `absent()` might cause false positive alerts when Prometheus restarts.
            fragment: absent(absent_up{job="a"})
            start: 0
            end: 26
            line: 2
  - name: absent with long enough for
    kind: negative
    settings:
      scrapeInterval: 1m
    rules: |
      - alert: Missing
        expr: 'absent(absent_for_up{job="a"})'
        for: 5m
    data:
      step: 1m
      series:
        - metric: absent_for_up{job="a"}
          values: 1x30
    expect: []
  - name: absent with for shorter than two scrape intervals
    kind: positive
    settings:
      scrapeInterval: 1m
    rules: |
      - alert: Missing
        expr: 'absent(absent_short_up{job="a"})'
        for: 1m
    data:
      step: 1m
      series:
        - metric: absent_short_up{job="a"}
          values: 1x30
    expect:
      - rule: Missing
        reporter: alerts/absent
        severity: warning
        summary: absent() based alert with insufficient for
        lines: "2"
        diagnostics:
          - message: Using `absent()` might cause false positive alerts when Prometheus restarts.
            fragment: absent(absent_short_up{job="a"})
            start: 0
            end: 32
            line: 2
          - message: Use a value that's at least twice Prometheus scrape interval (`1m`).
            fragment: 1m
            start: 0
            end: 2
            line: 3
  - name: absent inside a WITH template
    kind: positive
    settings:
      scrapeInterval: 1m
    rules: |
      - alert: Missing
        expr: 'WITH (missing(m) = absent(m)) missing(absent_with_up{job="a"})'
    data:
      step: 1m
      series:
        - metric: absent_with_up{job="a"}
          values: 1x30
    expect:
      - rule: Missing
        reporter: alerts/absent
        severity: warning
        summary: absent() based alert without for
        lines: "2"
        diagnostics:
          - message: Using `absent()` might cause false positive alerts when Prometheus restarts.
            fragment: missing(absent_with_up{job="a"})
            start: 30
            end: 62
            line: 2
  - name: absent on a metric with pauses longer than the instant query lookback
    kind: positive
    comment: >
      vmalert evaluates absent() with instant queries that look back one query step (5m).
      The metric has a sample every 10m and one pause of 70m, `for` covers the 10m pauses only.
    settings:
      scrapeInterval: 1m
    rules: |
      - alert: Gone
        expr: 'absent(absent_sparse{job="a"})'
        for: 10m
    data:
      step: 10m
      series:
        - metric: absent_sparse{job="a"}
          values: 1x30 _x6 1x30
    vm:
      - query: absent(absent_sparse{job="a"})
        result: empty
      - query: count_over_time(absent(last_over_time(absent_sparse{job="a"}[5m]))[11h:5m]) > bool 50
        result: '{} 1'
    expect:
      - rule: Gone
        reporter: alerts/absent
        severity: warning
        summary: absent() window shorter than pauses between samples
        lines: "2"
        diagnostics:
          - message_re: 'had 1 pause\(s\) longer than 5m on `vm` VictoriaMetrics server at \S+, the longest at least 1h(5m)?, while samples kept arriving, so this alert fires during normal pauses, not only when `absent_sparse\{job="a"\}` disappears\. `for: 10m` covers pauses up to 15m only\.'
            fragment: absent(absent_sparse{job="a"})
            start: 0
            end: 30
            line: 2
  - name: for longer than the pauses
    kind: negative
    settings:
      scrapeInterval: 1m
    rules: |
      - alert: Gone
        expr: 'absent(absent_sparse_for{job="a"})'
        for: 2h
    data:
      step: 10m
      series:
        - metric: absent_sparse_for{job="a"}
          values: 1x30 _x6 1x30
    expect: []
