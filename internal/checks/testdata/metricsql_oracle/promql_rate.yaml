check: promql/rate
cases:
  - name: window shorter than one scrape interval
    kind: positive
    comment: VictoriaMetrics uses the last sample before the window, so rate() needs at least one scrape interval.
    settings:
      scrapeInterval: 1m
    rules: |
      - record: x
        expr: 'rate(rate_short_total[30s])'
    data:
      step: 1m
      series:
        - metric: rate_short_total{job="a"}
          values: 0+60x30
    vm:
      - query: rate(rate_short_total[5m])
        result: '{job="a"} 1'
    expect:
      - rule: x
        reporter: promql/rate
        severity: bug
        summary: duration too small
        lines: "2"
        diagnostics:
          - message: Duration for `rate()` must be at least 1 x scrape_interval, `vm` Prometheus server at $URI is using `1m` scrape_interval.
            fragment: rate(rate_short_total[30s])
            start: 0
            end: 27
            line: 2
  - name: window exactly one scrape interval
    kind: boundary
    comment: |
      A window of one scrape interval has a single sample, VictoriaMetrics still returns
      a result because it includes the last sample before the window, while the Prometheus
      compatible rate_prometheus() returns nothing.
    settings:
      scrapeInterval: 1m
    rules: |
      - record: x
        expr: 'rate(rate_one_total[1m])'
    data:
      step: 1m
      series:
        - metric: rate_one_total{job="a"}
          values: 0+60x30
    vm:
      - query: rate(rate_one_total[1m])
        result: '{job="a"} 1'
      - query: irate(rate_one_total[1m])
        result: '{job="a"} 1'
      - query: increase(rate_one_total[1m])
        result: '{job="a"} 60'
      - query: increase_prometheus(rate_one_total[1m])
        result: empty
    expect: []
  - name: rate_prometheus window shorter than two scrape intervals
    kind: positive
    settings:
      scrapeInterval: 1m
    rules: |
      - record: x
        expr: 'rate_prometheus(rate_prom_total[1m])'
    data:
      step: 1m
      series:
        - metric: rate_prom_total{job="a"}
          values: 0+60x30
    vm:
      - query: rate_prometheus(rate_prom_total[1m])
        result: empty
      # Two samples in the window, 60 apart: 60 / 120s.
      - query: rate_prometheus(rate_prom_total[2m])
        result: '{job="a"} 0.5'
    expect:
      - rule: x
        reporter: promql/rate
        severity: bug
        summary: duration too small
        lines: "2"
        diagnostics:
          - message: Duration for `rate_prometheus()` must be at least 2 x scrape_interval, `vm` Prometheus server at $URI is using `1m` scrape_interval.
            fragment: rate_prometheus(rate_prom_total[1m])
            start: 0
            end: 36
            line: 2
  - name: window of five scrape intervals
    kind: negative
    settings:
      scrapeInterval: 1m
    rules: |
      - record: x
        expr: 'rate(rate_ok_total[5m])'
    data:
      step: 1m
      series:
        - metric: rate_ok_total{job="a"}
          values: 0+60x30
    vm:
      - query: rate(rate_ok_total[5m])
        result: '{job="a"} 1'
    expect: []
  - name: window exactly two scrape intervals
    kind: boundary
    settings:
      scrapeInterval: 1m
    rules: |
      - record: x
        expr: 'rate(rate_two_total[2m])'
    data:
      step: 1m
      series:
        - metric: rate_two_total{job="a"}
          values: 0+60x30
    expect: []
  - name: implicit MetricsQL window
    kind: negative
    comment: MetricsQL picks the window from the step and scrape interval, there's nothing to report.
    settings:
      scrapeInterval: 1m
    rules: |
      - record: x
        expr: 'rate(rate_implicit_total)'
    data:
      step: 1m
      series:
        - metric: rate_implicit_total{job="a"}
          values: 0+60x30
    expect: []
  - name: rate on a gauge without metadata
    kind: negative
    comment: Detecting rate() on gauges needs metric metadata. VictoriaMetrics stores it since v1.130.0, but the oracle imports data without TYPE lines, so it's never reported here.
    settings:
      scrapeInterval: 1m
    rules: |
      - record: x
        expr: 'rate(rate_gauge[5m])'
    data:
      step: 1m
      series:
        - metric: rate_gauge{job="a"}
          values: 5x10 3x10 7x10
    vm:
      - query: count(rate_gauge)
        result: '{} 1'
    expect: []
  - name: window shorter than two scrape intervals minus the step
    kind: positive
    comment: >-
      With a 10m scrape interval and the default 5m query step a 12m window can have a single
      sample and the sample before it is more than 5m before the window, rate() then returns
      nothing (Docker v1.153.0: empty or zero on 36 of 120 instant queries, never for 15m).
    settings:
      scrapeInterval: 10m
    rules: |
      - record: x
        expr: 'rate(rate_step_short_total[12m])'
    data:
      step: 10m
      series:
        - metric: rate_step_short_total{job="a"}
          values: 0+100x30
    expect:
      - rule: x
        reporter: promql/rate
        severity: warning
        summary: duration too small
        lines: "2"
        diagnostics:
          - message: '`rate()` needs a window of at least 15m with the `10m` scrape_interval of `vm` VictoriaMetrics server at $URI: vmalert evaluates the rule with instant queries with a 5m step, the query step, default vmalert -datasource.queryStep (5m), and VictoriaMetrics uses the last sample before the window only if it''s at most 5m before the window. A `[12m]` window can have a single sample, so it can return no results or wrong ones.'
            fragment: rate(rate_step_short_total[12m])
            start: 0
            end: 32
            line: 2
  - name: window of two scrape intervals minus the step
    kind: boundary
    settings:
      scrapeInterval: 10m
    rules: |
      - record: x
        expr: 'rate(rate_step_ok_total[15m])'
    data:
      step: 10m
      series:
        - metric: rate_step_ok_total{job="a"}
          values: 0+100x30
    vm:
      - query: rate(rate_step_ok_total[15m]) > bool 0
        result: '{job="a"} 1'
    expect: []
  - name: deriv window shorter than two scrape intervals
    kind: positive
    comment: deriv() only uses samples inside the window, whatever the query step.
    settings:
      scrapeInterval: 10m
    rules: |
      - record: x
        expr: 'deriv(rate_deriv_short[15m])'
    data:
      step: 10m
      series:
        - metric: rate_deriv_short{job="a"}
          values: 0+100x30
    expect:
      - rule: x
        reporter: promql/rate
        severity: warning
        summary: duration too small
        lines: "2"
        diagnostics:
          - message: '`deriv()` needs a window of at least 20m with the `10m` scrape_interval of `vm` VictoriaMetrics server at $URI: `deriv()` only uses samples inside the window, so it needs two scrape intervals. A `[15m]` window can have a single sample, so it can return no results or wrong ones.'
            fragment: deriv(rate_deriv_short[15m])
            start: 0
            end: 28
            line: 2
  - name: rollup_rate window shorter than two scrape intervals minus 5m
    kind: positive
    comment: >-
      With a 10m scrape interval a 12m window can have a single sample and the sample before
      it is more than 5m before the window, rollup_rate() then returns 0 (Docker v1.153.0:
      wrong on 30 of 120 instant queries, never for 15m, whatever the step up to 10m).
    settings:
      scrapeInterval: 10m
    rules: |
      - record: x
        expr: 'rollup_rate(rollup_rate_short_total[12m])'
    data:
      step: 10m
      series:
        - metric: rollup_rate_short_total{job="a"}
          values: 0+100x30
    expect:
      - rule: x
        reporter: promql/rate
        severity: warning
        summary: duration too small
        lines: "2"
        diagnostics:
          - message: '`rollup_rate()` needs a window of at least 15m with the `10m` scrape_interval of `vm` VictoriaMetrics server at $URI: VictoriaMetrics uses the sample before the window only if it''s at most 5m before the window. A `[12m]` window can miss the samples `rollup_rate()` needs, so it can return `0` or nothing instead of the real value.'
            fragment: rollup_rate(rollup_rate_short_total[12m])
            start: 0
            end: 41
            line: 2
  - name: rollup_rate window of two scrape intervals minus 5m
    kind: boundary
    settings:
      scrapeInterval: 10m
    rules: |
      - record: x
        expr: 'rollup_rate(rollup_rate_ok_total[15m])'
    data:
      step: 10m
      series:
        - metric: rollup_rate_ok_total{job="a"}
          values: 0+100x30
    vm:
      - query: rollup_rate(rollup_rate_ok_total[15m], "min") > bool 0
        result: '{job="a"} 1'
    expect: []
  - name: interval between samples longer than the configured scrape interval
    kind: positive
    comment: >-
      scrapeInterval is 1m, but the metric is written every 10m. pint measures the interval
      with scrape_interval() and checks the window against it: with the default 5m query
      step rate() needs 2 x 10m - 5m.
    settings:
      scrapeInterval: 1m
    rules: |
      - record: x
        expr: 'rate(rate_measured_total[5m])'
    data:
      step: 10m
      series:
        - metric: rate_measured_total{job="a"}
          values: 0+100x30
    vm:
      - query: max(scrape_interval(rate_measured_total[15m]))
        result: '{} 600'
    expect:
      - rule: x
        reporter: promql/rate
        severity: warning
        summary: duration too small
        lines: "2"
        diagnostics:
          - message: '`rate()` needs a window of at least 15m with samples of `rate_measured_total` every 10m on `vm` VictoriaMetrics server at $URI (its slowest series in the last 15m, measured with `scrape_interval()`; `scrapeInterval` in pint config is 1m): vmalert evaluates the rule with instant queries with a 5m step, the query step, default vmalert -datasource.queryStep (5m), and VictoriaMetrics uses the last sample before the window only if it''s at most 5m before the window. A `[5m]` window can have a single sample, so it can return no results or wrong ones.'
            fragment: rate(rate_measured_total[5m])
            start: 0
            end: 29
            line: 2
