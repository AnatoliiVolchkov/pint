# Real VictoriaMetrics deployments used by pint integration tests.
# Images are pinned by version tag and multi-arch digest; host ports are random.
name: pint-vmtest

x-healthcheck: &healthcheck
  interval: 1s
  timeout: 2s
  retries: 60

services:
  vmsingle:
    image: victoriametrics/victoria-metrics:v1.115.0@sha256:d8ac3a1776c8a9beead8bbd42a489c82249b1bfe9071dfd4813f34ebe36354bb
    command:
      - -retentionPeriod=2
      - -inmemoryDataFlushInterval=1s
      - -search.latencyOffset=1s
      - -search.disableCache
    ports:
      - "127.0.0.1::8428"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]

  vmstorage:
    image: victoriametrics/vmstorage:v1.115.0-cluster@sha256:f2bfb3236c27decdefb42ef6f65350a54017fd8d4a95e36e74de7eebabc8aaa7
    command:
      - -retentionPeriod=2
      - -inmemoryDataFlushInterval=1s
    ports:
      - "127.0.0.1::8482"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8482/health"]

  vminsert:
    image: victoriametrics/vminsert:v1.115.0-cluster@sha256:28aedc63ca69c8d9a98e2bd6fe045b3f07bf24e3d2f0526cb6f761c08ca8bdf9
    command:
      - -storageNode=vmstorage:8400
    depends_on:
      vmstorage:
        condition: service_healthy
    ports:
      - "127.0.0.1::8480"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8480/health"]

  vmselect:
    image: victoriametrics/vmselect:v1.115.0-cluster@sha256:22e3d68ff1e231b414122979c10614d9d71794e734635a9def0507ca5c77f828
    command:
      - -storageNode=vmstorage:8401
      - -search.latencyOffset=1s
      - -search.disableCache
    depends_on:
      vmstorage:
        condition: service_healthy
    ports:
      - "127.0.0.1::8481"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8481/health"]
