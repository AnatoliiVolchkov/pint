# Real VictoriaMetrics deployments used by pint integration tests.
# Images are pinned by version tag and multi-arch digest; host ports are random.
# quay.io serves the same digests as Docker Hub without its anonymous pull rate limit,
# which failed CI runs pulling these images.
name: pint-vmtest

x-healthcheck: &healthcheck
  interval: 1s
  timeout: 2s
  retries: 60

services:
  vmsingle:
    image: quay.io/victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    command:
      - -retentionPeriod=2
      - -inmemoryDataFlushInterval=1s
      - -search.latencyOffset=1s
      - -search.disableCache
    ports:
      - "127.0.0.1::8428"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]

  vmstorage:
    image: quay.io/victoriametrics/vmstorage:v1.155.0-cluster@sha256:c681e527bbd58d636e2055a23218370c9a5e154eec72177aec459f4da47f6204
    command:
      - -retentionPeriod=2
      - -inmemoryDataFlushInterval=1s
    ports:
      - "127.0.0.1::8482"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8482/health"]

  vminsert:
    image: quay.io/victoriametrics/vminsert:v1.155.0-cluster@sha256:08f65ead1cf8e3a88f2eafdbcdd75b50aeee3b6520659bb51e0f450ff4948021
    command:
      - -storageNode=vmstorage:8400
    depends_on:
      vmstorage:
        condition: service_healthy
    ports:
      - "127.0.0.1::8480"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8480/health"]

  vmselect:
    image: quay.io/victoriametrics/vmselect:v1.155.0-cluster@sha256:2db2f418a4e2a6bbb245ae9b2aa7854bc02b6146757d209f91bd1b87b0d4e96e
    command:
      - -storageNode=vmstorage:8401
      - -search.latencyOffset=1s
      - -search.disableCache
    depends_on:
      vmstorage:
        condition: service_healthy
    ports:
      - "127.0.0.1::8481"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8481/health"]
