# Real VictoriaMetrics deployments used by pint integration tests.
# Images are pinned by version tag and multi-arch digest; host ports are random.
# quay.io serves the same digests as Docker Hub without its anonymous pull rate limit,
# which failed CI runs pulling these images.
name: pint-vmtest

x-healthcheck: &healthcheck
  interval: 1s
  timeout: 2s
  retries: 60

services:
  vmsingle:
    image: quay.io/victoriametrics/victoria-metrics:v1.153.0@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd
    command:
      - -retentionPeriod=2
      - -inmemoryDataFlushInterval=1s
      - -search.latencyOffset=1s
      - -search.disableCache
    ports:
      - "127.0.0.1::8428"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]

  vmstorage:
    image: quay.io/victoriametrics/vmstorage:v1.153.0-cluster@sha256:83e67bde1b2aa23b8393b0165c427cbd413696c9398cbdd75a709422786747f4
    command:
      - -retentionPeriod=2
      - -inmemoryDataFlushInterval=1s
    ports:
      - "127.0.0.1::8482"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8482/health"]

  vminsert:
    image: quay.io/victoriametrics/vminsert:v1.153.0-cluster@sha256:629d128af12ff951ad3bb2c3b2d45edb77fb561ce6b29ed644b8039e2bf218a7
    command:
      - -storageNode=vmstorage:8400
    depends_on:
      vmstorage:
        condition: service_healthy
    ports:
      - "127.0.0.1::8480"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8480/health"]

  vmselect:
    image: quay.io/victoriametrics/vmselect:v1.153.0-cluster@sha256:3a593a1d02f765f366f50712c68d0e9418ab04f07a61517882bdb7ff620b0f38
    command:
      - -storageNode=vmstorage:8401
      - -search.latencyOffset=1s
      - -search.disableCache
    depends_on:
      vmstorage:
        condition: service_healthy
    ports:
      - "127.0.0.1::8481"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8481/health"]
