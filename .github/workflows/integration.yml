name: VictoriaMetrics integration tests

# Documentation-only changes don't run these tests.
on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.claude/**"
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.claude/**"
  workflow_dispatch:

# A new push to a pull request cancels its previous run. Every push to main gets its own
# group, so runs on main never wait for or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

env:
  GOWORK: "off"

jobs:
  test-victoriametrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.ver
          cache: false

      - name: Configure private Go modules
        uses: ./.github/actions/private-go-modules
        with:
          token: ${{ secrets.METRICSQL_READ_TOKEN }}
          ssh-key: ${{ secrets.METRICSQL_DEPLOY_KEY }}

      - name: Pull VictoriaMetrics images
        run: docker compose -f internal/promapi/vmtest/docker-compose.yml pull --quiet

      # Tests start single-node and cluster VictoriaMetrics from
      # internal/promapi/vmtest/docker-compose.yml, PINT_VM_REQUIRED makes them fail
      # instead of skipping if that is not possible.
      - name: Integration tests
        env:
          PINT_VM_REQUIRED: "1"
        run: |
          go test -count=1 -timeout=20m -v \
            -run 'VictoriaMetrics(Integration|Scripts|Semantic|API|CLI)|ImportAndQuery' \
            ./internal/promapi/... ./internal/checks/ ./cmd/pint/ 2>&1 | tee integration.log
          grep -E '^(ok|FAIL|---)' integration.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-log
          path: integration.log
