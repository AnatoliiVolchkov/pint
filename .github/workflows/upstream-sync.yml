name: Upstream sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only detect and test-merge upstream changes, do not push or open a pull request.
        type: boolean
        default: false
      tag:
        description: Upstream release tag to merge, for example v0.89.0. Empty means the newest stable release.
        type: string
        default: ""
      mode:
        description: release merges an upstream release tag, branch merges the head of upstream main.
        type: choice
        options:
          - release
          - branch
        default: release
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          fetch-depth: 0
          ref: main
          # GITHUB_TOKEN cannot push merges that change .github/workflows, SYNC_TOKEN can.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.ver
          cache: false

      - name: Configure private Go modules
        uses: ./.github/actions/private-go-modules
        with:
          token: ${{ secrets.METRICSQL_READ_TOKEN }}
          ssh-key: ${{ secrets.METRICSQL_DEPLOY_KEY }}

      - name: Merge upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          UPSTREAM_URL: https://github.com/cloudflare/pint.git
          # Only stable upstream releases are merged by default, see docs/UPSTREAM_SYNC.md.
          UPSTREAM_MODE: ${{ inputs.mode || 'release' }}
          UPSTREAM_TAG: ${{ inputs.tag }}
          UPSTREAM_BRANCH: main
          BASE_BRANCH: main
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TEST_CMD: go mod download && go build ./... && go vet ./... && go test -count=1 -timeout=20m ./...
        run: bash .github/scripts/upstream-sync.sh
